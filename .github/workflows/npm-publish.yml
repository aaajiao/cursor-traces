name: Publish to npm

on:
  release:
    types: [created]  # 当你创建一个 Release 时触发
  # 或者你可以用 push 到 main 分支触发：
  # push:
  #   branches:
  #     - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 👈 如果是 Trusted Publishing，这行至关重要

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          # 👇 关键点 1：告诉 action 我们要发包到 npmjs.org
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci # 或者 npm install

      - run: npm publish --provenance --access public
        env:
          # 👇 关键点 2：将 Token 注入环境变量
          # 如果你配置了 Trusted Publishing，用 secrets.GITHUB_TOKEN
          # 如果你用的是传统 Token，用 secrets.NPM_TOKEN
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
